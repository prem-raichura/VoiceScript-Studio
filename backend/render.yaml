# yaml-language-server: $schema=https://raw.githubusercontent.com/render-oss/render-schema/master/render.yaml.json
services:
  # ── Backend Web Service (Docker) ──
  - type: web
    name: voicescript-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free # Change this if you need more resources
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # You will set this to your frontend URL in the Render dashboard later
      - key: GROQ_API_KEY
        sync: false # You will set this securely in the Render dashboard


