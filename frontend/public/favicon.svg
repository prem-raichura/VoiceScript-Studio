<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- White rounded square background with subtle shadow border -->
  <rect width="64" height="64" rx="16" fill="white"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lucide Mic icon — slate-900 (#0f172a), centered and scaled -->
  <!-- Original Lucide viewBox 24x24, scaled to fit ~26px in 64px canvas (offset 19,10) -->
  <g transform="translate(12, 9) scale(1.67)">
    <!-- Mic body -->
    <rect x="9" y="2" width="6" height="11" rx="3" fill="#0f172a"/>
    <!-- Arc / stand -->
    <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Stem -->
    <line x1="12" y1="19" x2="12" y2="22" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Base -->
    <line x1="8" y1="22" x2="16" y2="22" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>